<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cheetah</title>
<style>
  :root{
    --bg:#efeee9; --surface:#ffffff; --surface-2:#f3f1ec; --ink:#15181f; --muted:#8d929c;
    --line:#e3e0d8; --nav:#15181f; --nav-2:#252933; --green:#2fbd91; --green-dark:#24916f;
    --red:#f06b57; --purple:#a489dc; --yellow:#f6cf65; --blue:#5a82f2; --shadow:0 1px 0 rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%}
  body{
    min-width:1120px; color:var(--ink); background:#111318;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  button,input,textarea,select{font:inherit} button{border:0}
  .desktop-app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden;background:var(--bg)}
  .desktop-app.dark{--bg:#17191f;--surface:#20232b;--surface-2:#2b2e36;--ink:#f6f7f9;--muted:#a5abb6;--line:#343842}
  .sidebar{height:100%;min-height:0;background:var(--nav);color:#cfd6e6;padding:28px 18px;display:flex;flex-direction:column;gap:34px}
  .brand{display:flex;align-items:center;gap:12px;padding:0 10px}
  .brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#34c79a,#19986f);display:grid;place-items:center;color:white;font-size:20px;font-weight:900}
  .brand-name{color:#fff;font-size:20px;font-weight:900;letter-spacing:-.02em}
  .side-nav{display:flex;flex-direction:column;gap:8px}
  .nav-item{height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:12px;background:transparent;color:#bcc5d5;cursor:pointer;font-weight:700;text-align:left}
  .nav-item:hover{background:#242832}.nav-item.active{background:#3a3e47;color:#fff}
  .nav-ic{width:18px;text-align:center}
  .side-budget{margin-top:auto;background:#252a34;border-radius:14px;padding:18px;color:#fff}
  .side-budget .label{color:#a9b0bc;font-size:14px;font-weight:700;margin-bottom:8px}
  .side-budget .amount{font-size:18px;font-weight:900}.side-budget .amount span{color:#a9b0bc;font-weight:700}
  .mini-progress{height:7px;border-radius:99px;background:#11151d;overflow:hidden;margin-top:13px}.mini-progress span{display:block;height:100%;background:#45d0a8;border-radius:99px}
  .main{min-width:0;height:100%;min-height:0;display:grid;grid-template-rows:98px minmax(0,1fr);background:var(--bg)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 34px;border-bottom:1px solid var(--line)}
  .date{color:var(--muted);font-weight:800;font-size:14px;margin-bottom:4px}.page-title{font-size:27px;font-weight:950;letter-spacing:-.04em}
  .top-actions{display:flex;align-items:center;gap:14px}
  .search-box{width:220px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;color:var(--ink);outline:0}
  .search-box:focus{border-color:#b7d8cc;box-shadow:0 0 0 3px rgba(47,189,145,.12)}
  .theme-btn,.primary-btn,.ghost-btn{height:44px;border-radius:10px;padding:0 18px;font-weight:900;cursor:pointer}
  .theme-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.primary-btn{background:#15181f;color:#fff}.ghost-btn{background:var(--surface-2);color:var(--ink)}
  .content{overflow:auto;padding:30px 34px 46px}.content::-webkit-scrollbar{width:8px}.content::-webkit-scrollbar-thumb{background:#c9c5bc;border-radius:99px}
  .grid{display:grid;gap:22px}.dashboard-grid{grid-template-columns:1.1fr .78fr .78fr}.two-col{grid-template-columns:minmax(0,1fr) 420px}.settings-grid{grid-template-columns:1fr 1fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
  .dark-card{background:#15181f;color:#fff;border-color:#15181f;position:relative;overflow:hidden}.dark-card::after{content:"";position:absolute;right:-30px;top:-55px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(47,189,145,.45),transparent 62%)}
  .card-title{font-size:18px;font-weight:950;margin-bottom:18px}.metric-label{color:var(--muted);font-weight:800;margin-bottom:12px}.metric-big{font-size:40px;font-weight:950;letter-spacing:-.05em;position:relative;z-index:1}
  .metric-sub{display:flex;gap:26px;color:#aab1bd;font-weight:800;margin-top:18px;position:relative;z-index:1}.up{color:var(--green)}.down,.red{color:var(--red)}.green{color:var(--green-dark)}
  .stat-card{min-height:160px}.stat-icon,.cat-icon,.account-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}
  .stat-value{font-size:31px;font-weight:950;margin-top:16px}.stat-note{color:var(--muted);font-size:14px;font-weight:800;margin-top:8px}
  .wide{grid-column:span 2}.line-chart{height:230px;width:100%;display:block}.chart-tabs{display:flex;gap:18px}.chart-tabs button{width:40px;height:32px;border-radius:9px;background:transparent;color:var(--muted);font-weight:900;cursor:pointer}.chart-tabs .active{background:#15181f;color:#fff}
  .donut-wrap{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:26px}.legend{display:grid;gap:16px}.legend-row{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:12px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%}
  .tx-row,.setting-row,.account-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .tx-row:first-of-type,.setting-row:first-of-type,.account-row:first-of-type{border-top:0}.tx-name,.row-title{font-weight:900}.tx-sub,.row-sub{color:var(--muted);font-size:13px;font-weight:700;margin-top:3px}
  .amount{font-weight:950}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.link-btn{background:transparent;color:var(--muted);font-weight:900;cursor:pointer}
  .segmented{display:inline-grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:13px;padding:4px}.segmented button{height:40px;border-radius:10px;background:transparent;color:var(--muted);font-weight:950;cursor:pointer}.segmented .active{background:#15181f;color:#fff}
  .amount-editor{font-size:52px;font-weight:950;letter-spacing:-.06em;margin:34px 0 20px}.cursor{color:var(--green);animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
  .category-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}.cat-tile{height:100px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:900;cursor:pointer}.cat-tile.active{border-color:var(--green);background:rgba(47,189,145,.08)}
  .form-stack{display:grid;gap:14px}.field-label{color:var(--muted);font-size:13px;font-weight:800}.field,.select{width:100%;height:48px;border-radius:11px;border:0;background:var(--surface-2);color:var(--ink);padding:0 16px;outline:0}.field:focus,.select:focus{box-shadow:0 0 0 3px rgba(47,189,145,.14)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{height:58px;border-radius:11px;background:var(--surface-2);color:var(--ink);font-size:22px;font-weight:900;cursor:pointer}.save-btn{height:56px;border-radius:12px;background:var(--green-dark);color:#fff;font-weight:950;cursor:pointer}
  .budget-layout{grid-template-columns:350px 1fr}.donut-card{background:#15181f;color:#fff;border-color:#15181f;min-height:520px;display:flex;flex-direction:column;align-items:center}.big-donut{width:220px;height:220px;margin:28px 0}.budget-value{font-size:28px;font-weight:950}.budget-list{display:grid;gap:26px}.budget-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}.bar-fill{height:100%;border-radius:99px}
  .bars{height:250px;display:grid;grid-template-columns:repeat(6,1fr);align-items:end;gap:32px;padding:24px 70px 0}.bar-pair{height:210px;display:flex;align-items:end;justify-content:center;gap:12px}.bar-income,.bar-expense{width:18px;border-radius:6px 6px 0 0}.bar-income{background:var(--green)}.bar-expense{background:#ff9b87}.bar-label{text-align:center;color:var(--muted);font-weight:800;margin-top:12px}
  .mini-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mini-stat{background:var(--surface-2);border-radius:13px;padding:22px}.mini-stat .v{font-size:24px;font-weight:950;margin-top:12px}
  .profile-card{height:112px;display:flex;align-items:center;gap:18px;background:#15181f;color:#fff;border-radius:20px;padding:24px;position:relative;overflow:hidden}.profile-card::after{content:"";position:absolute;right:-40px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(47,189,145,.45),transparent 64%)}
  .profile-avatar{width:62px;height:62px;border-radius:16px;background:var(--green-dark);display:grid;place-items:center;font-size:26px;font-weight:950;z-index:1}.pro-badge{margin-left:auto;background:rgba(255,255,255,.12);border-radius:10px;padding:9px 14px;font-weight:900;z-index:1}
  .toggle{width:48px;height:28px;border-radius:99px;background:#d5d1c8;position:relative;cursor:pointer;transition:.16s}.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.16s}.toggle.on{background:var(--green-dark)}.toggle.on::after{left:23px}
  .danger-btn{height:46px;border-radius:12px;background:var(--surface-2);color:var(--red);font-weight:950;cursor:pointer;width:100%;margin-top:18px}
  .toast{position:fixed;right:32px;top:28px;background:#15181f;color:#fff;border-radius:12px;padding:13px 18px;font-weight:800;z-index:10;box-shadow:0 18px 44px rgba(0,0,0,.22)}
  .budget-form,.account-form{display:grid;grid-template-columns:1fr 150px auto;gap:10px;margin-bottom:24px}
  .account-form{grid-template-columns:1fr 150px auto;margin-top:18px;margin-bottom:0;padding-top:18px;border-top:1px solid var(--line)}
  .export-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .empty-state{padding:28px;text-align:center;color:var(--muted);font-weight:800;background:var(--surface-2);border-radius:14px}
  .muted{color:var(--muted)}
  @media (max-width:1180px){body{min-width:900px}.desktop-app{grid-template-columns:220px 1fr}.dashboard-grid,.two-col,.settings-grid,.budget-layout{grid-template-columns:1fr}.wide{grid-column:auto}.category-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
